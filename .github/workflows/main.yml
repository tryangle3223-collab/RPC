name: 캐릭터 꾸미기 APK 자동 빌드

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android 프로젝트 생성
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/dressup
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CharacterDressUp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.dressup'
              compileSdk 37

              defaultConfig {
                  applicationId 'com.example.dressup'
                  minSdk 23
                  targetSdk 37
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F5FC</item>
                  <item name="android:navigationBarColor">#F7F5FC</item>
                  <item name="android:colorAccent">#7C5CFC</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="캐릭터 꾸미기"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/dressup/MainActivity.java <<'EOF'
          package com.example.dressup;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.Random;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(new DressUpView(this));
              }

              static class DressUpView extends View {

                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Random random = new Random();
                  SharedPreferences save;

                  int category = 0;
                  int hair = 0;
                  int face = 0;
                  int clothes = 0;
                  int accessory = 0;

                  String message = "나만의 캐릭터를 꾸며보세요!";
                  int purple = Color.rgb(124,92,252);

                  String[][] names = {
                      {"단발","긴머리","포니","양갈래","곱슬"},
                      {"미소","윙크","하트눈","졸림","놀람"},
                      {"후드","원피스","티셔츠","정장","파자마"},
                      {"없음","안경","왕관","리본","별"}
                  };

                  DressUpView(Context context) {
                      super(context);

                      save = context.getSharedPreferences(
                          "character",
                          Context.MODE_PRIVATE
                      );

                      hair = save.getInt("hair",0);
                      face = save.getInt("face",0);
                      clothes = save.getInt("clothes",0);
                      accessory = save.getInt("accessory",0);

                      setBackgroundColor(Color.rgb(247,245,252));
                  }

                  float d(float v) {
                      return v * getResources()
                          .getDisplayMetrics().density;
                  }

                  void text(
                      Canvas c,
                      String s,
                      float size,
                      int color,
                      float x,
                      float y,
                      boolean bold
                  ) {
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(color);
                      p.setTextSize(d(size));
                      p.setTypeface(
                          Typeface.create(
                              "sans",
                              bold ? Typeface.BOLD : Typeface.NORMAL
                          )
                      );
                      c.drawText(s,x,y,p);
                  }

                  void centerText(
                      Canvas c,
                      String s,
                      float size,
                      int color,
                      float x,
                      float y
                  ) {
                      p.setTextSize(d(size));
                      p.setTypeface(Typeface.DEFAULT_BOLD);
                      p.setColor(color);

                      c.drawText(
                          s,
                          x - p.measureText(s)/2,
                          y,
                          p
                      );
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      int w = getWidth();

                      text(
                          c,
                          "✨ 캐릭터 꾸미기",
                          24,
                          Color.rgb(40,35,50),
                          d(20),
                          d(40),
                          true
                      );

                      text(
                          c,
                          "나만의 캐릭터를 만들어 보세요",
                          13,
                          Color.rgb(110,103,125),
                          d(20),
                          d(63),
                          false
                      );

                      drawCharacter(c,w);
                      drawCategories(c,w);
                      drawItems(c,w);
                      drawButtons(c,w);
                  }

                  void drawCharacter(Canvas c,int w) {

                      p.setColor(Color.WHITE);

                      c.drawRoundRect(
                          d(14),
                          d(82),
                          w-d(14),
                          d(360),
                          d(24),
                          d(24),
                          p
                      );

                      float cx = w/2f;
                      float cy = d(218);

                      int[] body = {
                          Color.rgb(105,145,220),
                          Color.rgb(242,125,155),
                          Color.rgb(110,190,160),
                          Color.rgb(105,105,120),
                          Color.rgb(170,135,210)
                      };

                      p.setColor(body[clothes]);

                      c.drawRoundRect(
                          cx-d(60),
                          cy+d(55),
                          cx+d(60),
                          cy+d(135),
                          d(30),
                          d(30),
                          p
                      );

                      p.setColor(Color.rgb(250,210,180));

                      c.drawRoundRect(
                          cx-d(15),
                          cy+d(30),
                          cx+d(15),
                          cy+d(65),
                          d(8),
                          d(8),
                          p
                      );

                      p.setColor(Color.rgb(255,220,190));
                      c.drawCircle(cx,cy,d(62),p);

                      drawHair(c,cx,cy);
                      drawFace(c,cx,cy);
                      drawAccessory(c,cx,cy);

                      centerText(
                          c,
                          message,
                          14,
                          Color.rgb(86,75,105),
                          cx,
                          d(338)
                      );
                  }

                  void drawHair(Canvas c,float x,float y) {

                      p.setColor(Color.rgb(77,57,48));

                      if(hair==0) {

                          c.drawCircle(x,y-d(42),d(50),p);

                          c.drawRoundRect(
                              x-d(52),
                              y-d(42),
                              x+d(52),
                              y+d(8),
                              d(25),
                              d(25),
                              p
                          );

                      } else if(hair==1) {

                          c.drawCircle(x,y-d(42),d(52),p);

                          c.drawRoundRect(
                              x-d(54),
                              y-d(45),
                              x-d(27),
                              y+d(70),
                              d(18),
                              d(18),
                              p
                          );

                          c.drawRoundRect(
                              x+d(27),
                              y-d(45),
                              x+d(54),
                              y+d(70),
                              d(18),
                              d(18),
                              p
                          );

                      } else if(hair==2) {

                          c.drawCircle(x,y-d(42),d(50),p);
                          c.drawCircle(x+d(48),y-d(55),d(22),p);

                      } else if(hair==3) {

                          c.drawCircle(x,y-d(42),d(48),p);
                          c.drawCircle(x-d(52),y-d(30),d(22),p);
                          c.drawCircle(x+d(52),y-d(30),d(22),p);

                      } else {

                          c.drawCircle(x,y-d(43),d(52),p);
                          c.drawCircle(x-d(44),y-d(12),d(24),p);
                          c.drawCircle(x+d(44),y-d(12),d(24),p);
                      }
                  }

                  void drawFace(Canvas c,float x,float y) {

                      p.setColor(Color.rgb(55,48,62));

                      if(face==1) {

                          p.setStyle(Paint.Style.FILL);

                          c.drawCircle(
                              x-d(22),
                              y-d(3),
                              d(7),
                              p
                          );

                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(d(4));

                          c.drawLine(
                              x+d(15),
                              y-d(3),
                              x+d(30),
                              y-d(3),
                              p
                          );

                      } else if(face==2) {

                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.rgb(220,90,120));

                          heart(c,x-d(22),y-d(3));
                          heart(c,x+d(22),y-d(3));

                      } else if(face==3) {

                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(d(4));

                          c.drawLine(
                              x-d(29),
                              y,
                              x-d(14),
                              y,
                              p
                          );

                          c.drawLine(
                              x+d(14),
                              y,
                              x+d(29),
                              y,
                              p
                          );

                      } else {

                          p.setStyle(Paint.Style.FILL);

                          c.drawCircle(
                              x-d(22),
                              y-d(3),
                              d(7),
                              p
                          );

                          c.drawCircle(
                              x+d(22),
                              y-d(3),
                              d(7),
                              p
                          );
                      }

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(d(3));

                      RectF mouth = new RectF(
                          x-d(15),
                          y+d(8),
                          x+d(15),
                          y+d(30)
                      );

                      c.drawArc(
                          mouth,
                          face==3 ? 0 : 20,
                          face==3 ? 180 : 140,
                          false,
                          p
                      );

                      p.setStyle(Paint.Style.FILL);
                  }

                  void heart(Canvas c,float x,float y) {

                      Path path = new Path();

                      path.moveTo(x,y+d(9));

                      path.cubicTo(
                          x-d(15),y-d(3),
                          x-d(8),y-d(15),
                          x,y-d(5)
                      );

                      path.cubicTo(
                          x+d(8),y-d(15),
                          x+d(15),y-d(3),
                          x,y+d(9)
                      );

                      c.drawPath(path,p);
                  }

                  void drawAccessory(Canvas c,float x,float y) {

                      if(accessory==1) {

                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(d(4));
                          p.setColor(Color.DKGRAY);

                          c.drawRoundRect(
                              x-d(35),y-d(17),
                              x-d(5),y+d(7),
                              d(7),d(7),p
                          );

                          c.drawRoundRect(
                              x+d(5),y-d(17),
                              x+d(35),y+d(7),
                              d(7),d(7),p
                          );

                          c.drawLine(
                              x-d(5),y-d(5),
                              x+d(5),y-d(5),
                              p
                          );

                          p.setStyle(Paint.Style.FILL);

                      } else if(accessory==2) {

                          p.setColor(Color.rgb(245,190,50));

                          Path crown = new Path();

                          crown.moveTo(x-d(28),y-d(65));
                          crown.lineTo(x-d(18),y-d(82));
                          crown.lineTo(x,y-d(67));
                          crown.lineTo(x+d(18),y-d(82));
                          crown.lineTo(x+d(28),y-d(65));
                          crown.close();

                          c.drawPath(crown,p);

                      } else if(accessory==3) {

                          p.setColor(Color.rgb(240,90,135));

                          c.drawCircle(
                              x-d(42),
                              y-d(45),
                              d(15),
                              p
                          );

                          c.drawCircle(
                              x-d(25),
                              y-d(45),
                              d(15),
                              p
                          );

                      } else if(accessory==4) {

                          p.setColor(Color.rgb(250,190,50));

                          Path star = new Path();

                          for(int i=0;i<10;i++) {

                              double a =
                                  -Math.PI/2 +
                                  i*Math.PI/5;

                              float r =
                                  i%2==0 ? d(15) : d(7);

                              float px =
                                  x+d(52) +
                                  (float)Math.cos(a)*r;

                              float py =
                                  y-d(45) +
                                  (float)Math.sin(a)*r;

                              if(i==0)
                                  star.moveTo(px,py);
                              else
                                  star.lineTo(px,py);
                          }

                          star.close();
                          c.drawPath(star,p);
                      }
                  }

                  void drawCategories(Canvas c,int w) {

                      String[] tabs={
                          "머리",
                          "표정",
                          "옷",
                          "소품"
                      };

                      float gap=d(7);
                      float left=d(14);
                      float total=w-d(28);
                      float bw=(total-gap*3)/4;

                      for(int i=0;i<4;i++) {

                          float x=
                              left+i*(bw+gap);

                          p.setColor(
                              i==category
                              ? purple
                              : Color.WHITE
                          );

                          c.drawRoundRect(
                              x,d(376),
                              x+bw,d(420),
                              d(14),d(14),p
                          );

                          centerText(
                              c,
                              tabs[i],
                              14,
                              i==category
                              ? Color.WHITE
                              : Color.rgb(82,75,98),
                              x+bw/2,
                              d(404)
                          );
                      }
                  }

                  void drawItems(Canvas c,int w) {

                      float top=d(432);
                      float gap=d(8);
                      float left=d(14);
                      float total=w-d(28);
                      float bw=(total-gap*2)/3;
                      float bh=d(52);

                      int selected;

                      if(category==0)
                          selected=hair;
                      else if(category==1)
                          selected=face;
                      else if(category==2)
                          selected=clothes;
                      else
                          selected=accessory;

                      for(int i=0;i<5;i++) {

                          int row=i/3;
                          int col=i%3;

                          float x=
                              left+col*(bw+gap);

                          float y=
                              top+row*(bh+gap);

                          p.setColor(
                              i==selected
                              ? Color.rgb(235,229,255)
                              : Color.WHITE
                          );

                          c.drawRoundRect(
                              x,y,
                              x+bw,y+bh,
                              d(14),d(14),p
                          );

                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(d(1.5f));

                          p.setColor(
                              i==selected
                              ? purple
                              : Color.rgb(226,221,235)
                          );

                          c.drawRoundRect(
                              x,y,
                              x+bw,y+bh,
                              d(14),d(14),p
                          );

                          p.setStyle(Paint.Style.FILL);

                          centerText(
                              c,
                              names[category][i],
                              13,
                              Color.rgb(64,58,77),
                              x+bw/2,
                              y+d(32)
                          );
                      }
                  }

                  void drawButtons(Canvas c,int w) {

                      float y=d(556);
                      float gap=d(8);
                      float left=d(14);
                      float total=w-d(28);
                      float bw=(total-gap*2)/3;

                      String[] labels={
                          "랜덤",
                          "초기화",
                          "저장"
                      };

                      for(int i=0;i<3;i++) {

                          float x=
                              left+i*(bw+gap);

                          p.setColor(
                              i==2
                              ? purple
                              : Color.WHITE
                          );

                          c.drawRoundRect(
                              x,y,
                              x+bw,y+d(48),
                              d(15),d(15),p
                          );

                          centerText(
                              c,
                              labels[i],
                              13,
                              i==2
                              ? Color.WHITE
                              : Color.rgb(70,63,82),
                              x+bw/2,
                              y+d(30)
                          );
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {

                      if(e.getAction()!=MotionEvent.ACTION_UP)
                          return true;

                      float x=e.getX();
                      float y=e.getY();
                      int w=getWidth();

                      if(y>=d(376) && y<=d(420)) {

                          float gap=d(7);
                          float left=d(14);
                          float total=w-d(28);
                          float bw=(total-gap*3)/4;

                          for(int i=0;i<4;i++) {

                              float bx=
                                  left+i*(bw+gap);

                              if(x>=bx && x<=bx+bw) {

                                  category=i;
                                  invalidate();
                                  return true;
                              }
                          }
                      }

                      float top=d(432);
                      float gap=d(8);
                      float left=d(14);
                      float total=w-d(28);
                      float bw=(total-gap*2)/3;
                      float bh=d(52);

                      for(int i=0;i<5;i++) {

                          int row=i/3;
                          int col=i%3;

                          float bx=
                              left+col*(bw+gap);

                          float by=
                              top+row*(bh+gap);

                          if(
                              x>=bx &&
                              x<=bx+bw &&
                              y>=by &&
                              y<=by+bh
                          ) {

                              if(category==0)
                                  hair=i;
                              else if(category==1)
                                  face=i;
                              else if(category==2)
                                  clothes=i;
                              else
                                  accessory=i;

                              message=
                                  names[category][i]+
                                  " 선택!";

                              invalidate();
                              return true;
                          }
                      }

                      float by=d(556);
                      float bw2=(total-gap*2)/3;

                      if(y>=by && y<=by+d(48)) {

                          int which=
                              (int)((x-left)/(bw2+gap));

                          if(which==0) {

                              hair=random.nextInt(5);
                              face=random.nextInt(5);
                              clothes=random.nextInt(5);
                              accessory=random.nextInt(5);

                              message="랜덤 스타일 완성!";

                          } else if(which==1) {

                              hair=0;
                              face=0;
                              clothes=0;
                              accessory=0;

                              message="처음 모습으로 돌아왔어요.";

                          } else if(which==2) {

                              save.edit()
                                  .putInt("hair",hair)
                                  .putInt("face",face)
                                  .putInt("clothes",clothes)
                                  .putInt("accessory",accessory)
                                  .apply();

                              message="스타일을 저장했어요!";
                          }

                          invalidate();
                      }

                      return true;
                  }
              }
          }
          EOF

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: APK 빌드
        run: gradle :app:assembleDebug

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: character-dress-up-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
